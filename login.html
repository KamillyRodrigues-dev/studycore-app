<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body style="margin: 0%; font-family: poppins;">
    <main style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">

        <section class="fundo" style="background: linear-gradient(to top right, #300d68, #18151f); width: 55%; height: 100vh; position: absolute; left: 0; top: 0;">
            <div class="logo" style="position: absolute; top: 50%; left: 22%; margin-top: -162px; margin-left: -150px; width: 700px; height: 325px;">
                <img src="./assets/logoStudyCore.png" alt="Logo do StudyCore" style="width: 305px; height: 325px; position: absolute; left: 20px; top: 0;">
                <h3 style="color: white; font-weight: 600; position: absolute; left: 300px; top: 35px; font-size: 80px;">StudyCore</h3>
            </div>
        </section>

        <section class="fundo" style="background-color: #28282B; width: 45%; height: 100vh; position: absolute; right: 0; top: 0;">

                 <div class="titulo" style="position: absolute; width: 100%; left: 50%; transform: translateX(-50%); top: 4%;">
                     <h3 style="position: relative; font-weight: 600px; color: white; font-size: 45px; text-align: center; margin: 0 0 10px 0;">LOGIN</h3>
                     <p style="position: relative; font-weight: 300px; color: white; font-size: 20px; text-align: center; margin: 0;">COLOQUE SEUS DADOS PARA FAZER LOGIN</p>
                </div>

 
                <div class="buttons" style="margin-top: 27%;">
                    <button style="width:120px; height:40px; border-radius:20px; border:0; font-family: 'poppins'; background: linear-gradient(to bottom left, #49227B, #AE8CDA); color: white; margin-left: 31%; font-weight: 600; font-size: 13px;">GMAIL</button>
                    <button style="width:120px; height:40px; border-radius:20px; border:0; font-family: 'poppins'; background: linear-gradient(to bottom left, #49227B, #AE8CDA); color: white; margin-left: 10%; font-weight: 600; font-size: 13px;">GITHUB</button>
                    <p style="position: relative; font-weight: 300px; color: white; font-size: 16px; text-align: center; margin: 0; margin-top:3%;">OU</p>
                </div>


            

                <div style="position: relative; margin-bottom: 20px; width:86%; left:7%; margin-top: 20px;">
                    <label style="position: relative; margin-bottom: 5px; font-size: 16px; font-weight: 300; color: white; left:10px">EMAIL OU NOME DE USUÁRIO</label>
                    <input type="email" placeholder="EX: SEUEMAIL@GMAIL.COM" style="width: 100%; box-sizing: border-box; background-color: transparent; border: 1px solid #ffffff; border-radius: 25px; padding: 12px 20px; color: white; font-size: 14px;">
                </div>

                <div style="position: relative; margin-bottom: 10px; width:86%; left:7%;">
                    <label style="position: relative; margin-bottom: 5px; font-size: 16px; font-weight: 300; color: white; left:10px">SENHA</label>
                    <input type="password" placeholder="DIGITE A SUA SENHA" style="width: 100%; box-sizing: border-box; background-color: transparent; border: 1px solid #ffffff; border-radius: 25px; padding: 12px 20px; color: white; font-size: 14px;">
                </div>
        
                <div style="font-size: 11px; color: #a0a0a0; margin-bottom: 20px; margin-left: 9%;">NO MÍNIMO 8 DIGITOS</div>

                    <button style=" width: 40%; background: linear-gradient(to bottom left, #49227B, #AE8CDA); border: none; border-radius: 25px; padding: 14px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-bottom: 10px; margin-left:30%;">ENTRAR</button>

                    <p style="text-align: center; font-size: 14px; font-weight: bold; margin: 20px 0; letter-spacing: 0.5px; color: white;">NÃO TEM UMA CONTA?</p>

                    <a href="cadastro.html">
                        <button style="width: 30%; box-sizing: border-box; background-color: transparent; border: 2px solid #a0a0a0; border-radius: 25px; padding: 12px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; margin-left: 34.5%; "> CADASTRAR-SE </button> 
                    </a>        
           
        </section>
    </main>
</body>
</html>
